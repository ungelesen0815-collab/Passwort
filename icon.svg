<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas (Squircle, safe for maskable icon) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.3"/>
  <circle cx="256" cy="256" r="210" fill="url(#innerGlow)"/>

  <!-- Shield Body & Lock Shackle Group (Within 80% Safe Zone) -->
  <g filter="url(#shadow)">
    <!-- Lock Shackle -->
    <path d="M 186 215 V 162 C 186 123.3 217.3 92 256 92 C 294.7 92 326 123.3 326 162 V 215"
          fill="none"
          stroke="url(#accentGrad)"
          stroke-width="30"
          stroke-linecap="round"/>

    <!-- Vault / Shield Body -->
    <path d="M 140 215 C 140 200 152 188 167 188 H 345 C 360 188 372 200 372 215 V 295 C 372 375 256 424 256 424 C 256 424 140 375 140 295 Z"
          fill="#1e293b"
          stroke="url(#accentGrad)"
          stroke-width="8"
          stroke-linejoin="round"/>

    <!-- Inner Shield Accent Border -->
    <path d="M 162 225 C 162 216 169 208 178 208 H 334 C 343 208 350 216 350 225 V 288 C 350 348 256 388 256 388 C 256 388 162 348 162 288 Z"
          fill="#0f172a"
          fill-opacity="0.7"
          stroke="#38bdf8"
          stroke-width="2"
          stroke-opacity="0.4"/>

    <!-- Keyhole Emblem (Golden) -->
    <path d="M 256 252 A 26 26 0 0 0 238 277 L 243 328 C 243.5 334 248.5 338 256 338 C 263.5 338 268.5 334 269 328 L 274 277 A 26 26 0 0 0 256 252 Z"
          fill="url(#goldGrad)"/>
    <circle cx="256" cy="272" r="10" fill="#0f172a"/>
  </g>

  <!-- High-tech Accent Dots / Vault Marks -->
  <circle cx="256" cy="130" r="5" fill="#38bdf8"/>
  <circle cx="178" cy="245" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="334" cy="245" r="4" fill="#38bdf8" opacity="0.6"/>
</svg>
