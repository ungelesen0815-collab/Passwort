name: Composer Security Audit

on:
  push:
    branches: [ main ]
    paths:
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/composer-audit.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/composer-audit.yml'
  schedule:
    # Jeden Montag um 06:00 UTC ausführen
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composer-audit:
    name: Security Vulnerability Scan (composer audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Validate composer files
        run: composer validate --no-check-publish

      - name: Run Composer Security Audit
        run: |
          echo "Prüfe Composer-Abhängigkeiten auf bekannte Sicherheitslücken..."
          composer audit --locked --format=plain
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            echo "### :white_check_mark: Composer Security Audit erfolgreich" >> "$GITHUB_STEP_SUMMARY"
            echo "Keine bekannten Sicherheitslücken in den erfassten Paketen gefunden." >> "$GITHUB_STEP_SUMMARY"
          fi
