; ==============================================================================
; PHP Configuration (php.ini) - Hardened & Function Restricted
; Application: Passwort & Vault Manager
; Security Model: Principle of Least Privilege (Default Deny)
; ==============================================================================
; Dieses php.ini aktiviert ausschliesslich die fuer den Betrieb der Anwendung
; (inkl. Authentifizierung, Tresor-Verschluesselung, TOTP 2FA, QR-Codes,
; Profilbild-Upload und Security-Audit) benoetigten internen Funktionen.
; Alle anderen internen PHP-Funktionen (1201 Funktionen)
; sind ueber disable_functions vollstaendig gesperrt.
; ==============================================================================

[PHP]

; --- Security & Environment ---
expose_php = Off
enable_dl = Off
allow_url_fopen = On
allow_url_include = Off
default_charset = "UTF-8"

; --- Error Handling & Logging ---
error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
log_errors = On
log_errors_max_len = 1024
ignore_repeated_errors = On
ignore_repeated_source = Off
report_memleaks = On

; --- Resource Limits ---
max_execution_time = 30
max_input_time = 60
memory_limit = 128M
post_max_size = 12M

; --- File Uploads (Profilbilder) ---
file_uploads = On
upload_max_filesize = 10M
max_file_uploads = 5

; --- Output Buffering ---
output_buffering = 4096
implicit_flush = Off

; --- Function Restriction (Principle of Least Privilege / Default Deny) ---
; Die folgenden Funktionsgruppen sind aktiv und erlaubt:
; 1. Core / Engine / SPL / Autoloading (spl_autoload_*, class_*, method_*, get_class, etc.)
; 2. Strings & Character Encodings (str_*, strlen, mb_*, iconv, preg_*, ctype_*)
; 3. Arrays (array_*, in_array, count, sort, etc.)
; 4. Cryptography, Hashing & Password Management (password_*, openssl_*, hash_*, random_*)
; 5. Session & Cookie Management (session_*, setcookie, header)
; 6. JSON, Serialization & Input Sanitization (json_*, htmlspecialchars, filter_*)
; 7. File, Directory & Upload Management (file_*, is_*, finfo_*, move_uploaded_file, etc.)
; 8. Image & QR-Code Generation (GD: image*, getimagesize)
; 9. External Security Audit & Time Sync (curl_*, socket_*)
; 10. Math & Date/Time (date, time, abs, min, max, etc.)
;
; Alle anderen 1201 internen PHP-Funktionen sind gesperrt (inkl. RCE, Shell, Process Control, etc.):
